{{define "target_row"}}
<tr id="target-{{.ID}}">
    <td id="status-{{.ID}}" class="status-cell">
        <span class="status-badge status-pending"><span class="status-dot"></span>Pending</span>
    </td>
    <td class="url-cell" title="{{.URL}}">{{.URL}}</td>
    <td class="latency-cell"><span id="latency-{{.ID}}">—</span></td>
    <td class="stats-cell"><span id="stats-{{.ID}}">
        <span class="mini-stat"><span class="mini-stat-label">checks</span><span class="mini-stat-value">0</span></span>
        <span class="mini-stat"><span class="mini-stat-label">failures</span><span class="mini-stat-value">0</span></span>
        <span class="mini-stat"><span class="mini-stat-label">p50</span><span class="mini-stat-value">—</span></span>
        <span class="mini-stat"><span class="mini-stat-label">p99</span><span class="mini-stat-value">—</span></span>
    </span></td>
    <td class="actions-cell">
        <button class="delete-btn" hx-delete="/targets/{{.ID}}" hx-target="#target-{{.ID}}" hx-swap="outerHTML">Delete</button>
    </td>
</tr>
{{end}}
