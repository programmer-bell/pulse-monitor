{{define "stats"}}
<span id="stats-{{.ID}}" hx-swap-oob="true">
    <span class="mini-stat"><span class="mini-stat-label">checks</span><span class="mini-stat-value">{{.Total}}</span></span>
    <span class="mini-stat"><span class="mini-stat-label">failures</span><span class="mini-stat-value">{{.Failures}}</span></span>
    <span class="mini-stat"><span class="mini-stat-label">p50</span><span class="mini-stat-value">{{.P50MS}} ms</span></span>
    <span class="mini-stat"><span class="mini-stat-label">p99</span><span class="mini-stat-value">{{.P99MS}} ms</span></span>
</span>
{{end}}
