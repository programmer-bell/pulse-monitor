# Air configuration file for live-reloading during development
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  include_ext = ["go", "html", "css", "js", "tpl"]
  exclude_dir = ["tmp", "bin", ".git", ".agents"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true
  poll = true
  poll_interval = 500
  # On shutdown air SIGINTs the server and gives it this long to drain
  # before SIGKILL — lets `docker compose kill -s SIGTERM app` end in a
  # graceful log instead of an abrupt kill.
  send_interrupt = true
  kill_delay = "3s"

[log]
  time = true

[misc]
  clean_on_exit = true
