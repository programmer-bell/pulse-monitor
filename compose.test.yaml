# Throwaway Postgres for the Phase 6 integration test only. The dev app
# never talks to this database; it exists so `make test-integration` can run
# the real HTTP stack against a real server without touching the production
# DATABASE_URL (.env -> Neon).
#
#   make test-db-up          # start the container
#   make test-integration    # TEST_DATABASE_URL=<this> go test -race ./integration/
#   make test-db-down        # stop and wipe it (-v drops the volume)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulse_test
      POSTGRES_PASSWORD: pulse_test
      POSTGRES_DB: pulse_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_test -d pulse_test"]
      interval: 2s
      timeout: 3s
      retries: 15